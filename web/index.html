<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glucoApi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #3b82f6;
    --blue-soft: rgba(59, 130, 246, .28);
    --red: #ef4444;
    --red-soft: rgba(239, 68, 68, .28);
    --bg-1: #0a1020;
    --bg-2: #160d1c;
    --text: #eef2ff;
    --muted: #9aa5c4;
    --glass: rgba(255, 255, 255, .07);
    --glass-border: rgba(255, 255, 255, .16);
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { min-height: 100%; }
  body {
    min-height: 100vh;
    font-family: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    padding: 32px 20px 60px;
    position: relative;
    overflow-x: hidden;
  }
  /* Orbes de color que se ven a través del cristal */
  body::before, body::after {
    content: ""; position: fixed; z-index: 0; border-radius: 50%;
    filter: blur(90px); pointer-events: none;
  }
  body::before { width: 460px; height: 460px; background: var(--blue); opacity: .45; top: -120px; left: -100px; }
  body::after  { width: 420px; height: 420px; background: var(--red);  opacity: .38; bottom: -120px; right: -80px; }

  .wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; }

  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .12);
    transition: border-color .25s, box-shadow .25s, transform .25s, background .25s;
  }
  /* Hover de las tarjetas: azul */
  .glass.hoverable:hover {
    border-color: rgba(59, 130, 246, .7);
    box-shadow: 0 10px 40px var(--blue-soft), inset 0 1px 0 rgba(255, 255, 255, .18);
    background: rgba(59, 130, 246, .10);
    transform: translateY(-3px);
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 24px; margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .drop {
    width: 38px; height: 38px; border-radius: 50% 50% 50% 8px; transform: rotate(-45deg);
    background: linear-gradient(135deg, var(--blue), var(--red));
    box-shadow: 0 0 18px var(--blue-soft);
  }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  h1 span { color: var(--blue); }
  .sub { color: var(--muted); font-size: .85rem; }

  .api { display: flex; gap: 8px; align-items: center; flex: 1 1 340px; max-width: 520px; }
  .api input { flex: 1; min-width: 0; }
  .badge { font-size: .75rem; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--glass-border); color: var(--muted); white-space: nowrap; }
  .badge.online { color: #93c5fd; border-color: rgba(59, 130, 246, .6); }
  .badge.offline { color: #fca5a5; border-color: rgba(239, 68, 68, .6); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .stat { padding: 20px 22px; }
  .stat .k { color: var(--muted); font-size: .82rem; margin-bottom: 8px; }
  .stat .v { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; }
  .stat .v small { font-size: .85rem; font-weight: 400; color: var(--muted); margin-left: 4px; }

  .grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
  .col-izq { display: flex; flex-direction: column; gap: 20px; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }

  .panel { padding: 24px; }
  h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; }

  .fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .fila h2 { margin-bottom: 0; }
  .acciones { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .acciones select { width: auto; min-width: 170px; padding: 8px 12px; font-size: .85rem; }
  .acciones button { padding: 8px 14px; font-size: .85rem; }

  label { display: block; font-size: .82rem; color: var(--muted); margin: 14px 0 6px; }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--text);
    background: rgba(255, 255, 255, .06);
    border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 11px 14px; outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  select option { color: #111; }
  input:hover, select:hover, textarea:hover { border-color: rgba(59, 130, 246, .6); }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft);
  }
  textarea { resize: vertical; min-height: 64px; }

  button {
    font: inherit; font-weight: 600; color: var(--text); cursor: pointer;
    border: 1px solid var(--glass-border); border-radius: 12px; padding: 11px 18px;
    background: rgba(255, 255, 255, .08);
    backdrop-filter: blur(10px);
    transition: background .2s, border-color .2s, box-shadow .2s, transform .15s;
  }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  button:active { transform: scale(.97); }
  /* Botón principal: azul al pasar el cursor */
  button.primary { width: 100%; margin-top: 20px; background: rgba(59, 130, 246, .25); border-color: rgba(59, 130, 246, .5); }
  button.primary:hover:not(:disabled) { background: var(--blue); border-color: var(--blue); box-shadow: 0 6px 24px var(--blue-soft); }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost:hover { border-color: var(--blue); background: rgba(59, 130, 246, .2); }

  .hint { color: var(--muted); font-size: .78rem; line-height: 1.4; margin-top: 8px; }

  .chart { width: 100%; height: 190px; margin-bottom: 18px; }
  .chart svg { width: 100%; height: 100%; display: block; }
  .empty { color: var(--muted); font-size: .9rem; padding: 28px 8px; text-align: center; }

  ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 430px; overflow-y: auto; }
  li {
    display: grid; grid-template-columns: 78px 1fr; gap: 12px; align-items: center;
    padding: 12px 14px; border-radius: 14px;
    border: 1px solid transparent; background: rgba(255, 255, 255, .04);
    transition: background .2s, border-color .2s;
  }
  /* Filas: azul en el rango normal o bajo, rojo cuando está alta */
  li:hover { background: rgba(59, 130, 246, .14); border-color: rgba(59, 130, 246, .5); }
  li.alta:hover { background: rgba(239, 68, 68, .14); border-color: rgba(239, 68, 68, .55); }
  .val { font-weight: 700; font-size: 1.2rem; }
  .val small { font-weight: 400; font-size: .7rem; color: var(--muted); margin-left: 2px; }
  li.alta .val { color: #fca5a5; }
  li.baja .val { color: #93c5fd; }
  .meta { font-size: .8rem; color: var(--muted); line-height: 1.4; }
  .meta b { color: var(--text); font-weight: 600; }

  .toast {
    position: fixed; z-index: 5; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    padding: 12px 20px; border-radius: 14px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; max-width: min(560px, calc(100vw - 40px));
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { border-color: rgba(239, 68, 68, .7); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <div class="brand">
      <div class="drop" aria-hidden="true"></div>
      <div>
        <h1>gluco<span>Api</span></h1>
        <div class="sub">Usuarios y lecturas de glucosa</div>
      </div>
    </div>
    <div class="api">
      <input id="apiUrl" type="url" placeholder="URL de la API" aria-label="URL de la API">
      <button class="ghost" id="saveApi" type="button">Conectar</button>
      <span class="badge offline" id="status">Conectando...</span>
    </div>
  </header>

  <section class="stats" aria-label="Resumen">
    <div class="glass hoverable stat"><div class="k">Última lectura</div><div class="v" id="sLast">-<small>mg/dL</small></div></div>
    <div class="glass hoverable stat"><div class="k">Promedio</div><div class="v" id="sAvg">-<small>mg/dL</small></div></div>
    <div class="glass hoverable stat"><div class="k">Dentro de rango (70 a 140)</div><div class="v" id="sRange">-<small>%</small></div></div>
    <div class="glass hoverable stat"><div class="k">Lecturas registradas</div><div class="v" id="sCount">0</div></div>
  </section>

  <div class="grid">
    <div class="col-izq">
      <section class="glass hoverable panel">
        <h2>Nuevo usuario</h2>
        <form id="formUsuario" novalidate>
          <label for="uNombre">Nombre</label>
          <input id="uNombre" maxlength="40" placeholder="Ej. Ana" autocomplete="given-name" required>

          <label for="uPrimerApellido">Primer apellido</label>
          <input id="uPrimerApellido" maxlength="40" placeholder="Ej. López" autocomplete="family-name" required>

          <label for="uSegundoApellido">Segundo apellido (opcional)</label>
          <input id="uSegundoApellido" maxlength="40" placeholder="Ej. Pérez" autocomplete="additional-name">

          <label for="uEmail">Email</label>
          <input id="uEmail" type="email" maxlength="50" placeholder="ana@example.com" autocomplete="email" required>

          <button class="primary" type="submit">Crear usuario</button>
        </form>
      </section>

      <section class="glass hoverable panel">
        <h2>Nueva lectura</h2>
        <form id="formMedida" novalidate>
          <label for="selUsuario">Usuario</label>
          <select id="selUsuario" required></select>
          <div class="hint" id="sinUsuarios">Crea un usuario primero para poder registrar medidas.</div>

          <label for="valor">Glucosa (mg/dL)</label>
          <input id="valor" type="number" min="20" max="600" inputmode="numeric" placeholder="Ej. 105" required>

          <label for="momento">Momento</label>
          <select id="momento">
            <option>En ayunas</option>
            <option>Antes de comer</option>
            <option>Después de comer</option>
            <option>Antes de dormir</option>
            <option>Otro</option>
          </select>

          <label for="nota">Nota (opcional, máx. 100)</label>
          <textarea id="nota" maxlength="100" placeholder="Ej. Después de caminar 20 minutos"></textarea>

          <button class="primary" id="btnGuardar" type="submit">Guardar lectura</button>
        </form>
      </section>
    </div>

    <section class="glass panel">
      <div class="fila">
        <h2>Historial</h2>
        <div class="acciones">
          <select id="selFiltro" aria-label="Filtrar por usuario"></select>
          <button class="ghost" id="btnRefrescar" type="button">Refrescar</button>
        </div>
      </div>
      <div class="chart" id="chart"></div>
      <ul id="lista"></ul>
    </section>
  </div>
</div>

<div class="glass toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const LS_API = 'glucoApi:v2:url';
  const LS_FILTRO = 'glucoApi:v2:filtro';

  let base = '';
  let usuarios = [];
  let medidas = [];
  let filtro = '';
  let usuariosPorId = {};

  /* Detecta el contexto de la aplicación:
     - Render / Tomcat ROOT: /            -> /api/glucosa
     - NetBeans local:       /API_HealthBlood_512/ -> /API_HealthBlood_512/api/glucosa */
  function contextoAplicacion() {
    let ruta = window.location.pathname;
    if (ruta.endsWith('/index.html')) ruta = ruta.slice(0, -'/index.html'.length);
    if (ruta.endsWith('/')) ruta = ruta.slice(0, -1);
    return ruta;
  }

  const API_DEFECTO = (window.location.origin && window.location.origin !== 'null')
    ? window.location.origin + contextoAplicacion() + '/api/glucosa'
    : 'http://localhost:8080/API_HealthBlood_512/api/glucosa';

  function normalizarBase(url) {
    return String(url || '').trim().replace(/\/+$/, '');
  }

  function toast(msg, error) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'glass toast show' + (error ? ' error' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 3200);
  }

  function setStatus(estado, texto) {
    const s = $('status');
    s.textContent = texto;
    s.className = 'badge ' + estado;
  }

  async function fetchJson(url, opciones, timeoutMs) {
    const ctrl = new AbortController();
    const limite = timeoutMs || 90000;
    const timer = setTimeout(() => ctrl.abort(), limite);
    try {
      const r = await fetch(url, Object.assign({}, opciones || {}, { signal: ctrl.signal }));
      const texto = await r.text();
      let data = null;
      if (texto) {
        try { data = JSON.parse(texto); } catch (e) { data = texto; }
      }
      if (!r.ok) {
        const mensaje = (data && data.error) ? data.error : 'Error HTTP ' + r.status;
        throw new Error(mensaje);
      }
      return data;
    } catch (e) {
      if (e.name === 'AbortError') {
        throw new Error('La API tardó demasiado en responder. Render puede estar iniciando; intenta de nuevo.');
      }
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  function nombreUsuario(u) {
    if (!u) return 'Usuario';
    return [u.nombre, u.primerApellido, u.segundoApellido]
      .filter((x) => x && String(x).trim())
      .join(' ');
  }

  function llenarSelectUsuarios() {
    const sel = $('selUsuario');
    const anterior = sel.value;
    sel.innerHTML = '';

    const vacio = document.createElement('option');
    vacio.value = '';
    vacio.textContent = usuarios.length ? 'Selecciona un usuario' : 'No hay usuarios';
    sel.appendChild(vacio);

    usuarios.forEach((u) => {
      const opt = document.createElement('option');
      opt.value = String(u.idUsuario);
      opt.textContent = nombreUsuario(u) + ' (ID ' + u.idUsuario + ')';
      sel.appendChild(opt);
    });

    if (usuarios.some((u) => String(u.idUsuario) === anterior)) {
      sel.value = anterior;
    } else if (usuarios.length === 1) {
      sel.value = String(usuarios[0].idUsuario);
    }

    const filtroSel = $('selFiltro');
    const filtroAnterior = filtro || filtroSel.value;
    filtroSel.innerHTML = '';

    const todos = document.createElement('option');
    todos.value = '';
    todos.textContent = 'Todos los usuarios';
    filtroSel.appendChild(todos);

    usuarios.forEach((u) => {
      const opt = document.createElement('option');
      opt.value = String(u.idUsuario);
      opt.textContent = nombreUsuario(u);
      filtroSel.appendChild(opt);
    });

    if (usuarios.some((u) => String(u.idUsuario) === filtroAnterior)) {
      filtroSel.value = filtroAnterior;
    } else {
      filtroSel.value = '';
    }

    const hayUsuarios = usuarios.length > 0;
    $('btnGuardar').disabled = !hayUsuarios;
    $('sinUsuarios').style.display = hayUsuarios ? 'none' : 'block';
  }

  async function cargarUsuarios() {
    const data = await fetchJson(base + '/getAllUsuarios', {}, 90000);
    usuarios = Array.isArray(data) ? data : [];
    usuariosPorId = {};
    usuarios.forEach((u) => { usuariosPorId[u.idUsuario] = u; });
    llenarSelectUsuarios();
  }

  async function cargarMedidas() {
    const id = $('selFiltro').value;
    filtro = id;
    const url = id
      ? base + '/getMedidasPorUsuario?idUsuario=' + encodeURIComponent(id)
      : base + '/getAllMedidas';

    const data = await fetchJson(url, {}, 90000);
    medidas = Array.isArray(data) ? data : [];

    try { localStorage.setItem(LS_FILTRO, filtro); } catch (e) {}
    render();
  }

  async function cargarTodo() {
    base = normalizarBase($('apiUrl').value) || API_DEFECTO;
    $('apiUrl').value = base;
    setStatus('offline', 'Conectando...');

    try {
      await cargarUsuarios();
      await cargarMedidas();
      setStatus('online', 'API conectada');
    } catch (e) {
      setStatus('offline', 'Sin conexión');
      toast(e.message || 'No se pudo conectar con la API', true);
    }
  }

  async function crearUsuario(e) {
    e.preventDefault();

    const nombre = $('uNombre').value.trim();
    const primerApellido = $('uPrimerApellido').value.trim();
    const segundoApellido = $('uSegundoApellido').value.trim();
    const email = $('uEmail').value.trim();

    if (!nombre || !primerApellido || !email) {
      toast('Nombre, primer apellido y email son obligatorios', true);
      return;
    }
    if (nombre.length > 40 || primerApellido.length > 40
        || segundoApellido.length > 40 || email.length > 50) {
      toast('Revisa la longitud de los campos', true);
      return;
    }

    const datos = new URLSearchParams();
    datos.append('nombre', nombre);
    datos.append('primerApellido', primerApellido);
    if (segundoApellido) datos.append('segundoApellido', segundoApellido);
    datos.append('email', email);

    try {
      const creado = await fetchJson(base + '/crearUsuario', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: datos
      }, 90000);

      toast('Usuario creado: ' + nombreUsuario(creado));
      $('formUsuario').reset();
      await cargarUsuarios();
      $('selUsuario').value = String(creado.idUsuario);
      await cargarMedidas();
      setStatus('online', 'API conectada');
    } catch (err) {
      toast(err.message || 'No se pudo crear el usuario', true);
    }
  }

  async function registrarMedida(e) {
    e.preventDefault();

    const idUsuario = Number($('selUsuario').value);
    const glucosa = Number($('valor').value);
    const contexto = $('momento').value.trim();
    const notas = $('nota').value.trim();

    if (!idUsuario) {
      toast('Selecciona un usuario', true);
      return;
    }
    if (!glucosa || glucosa < 20 || glucosa > 600) {
      toast('Escribe un valor entre 20 y 600 mg/dL', true);
      $('valor').focus();
      return;
    }
    if (contexto.length > 40) {
      toast('El contexto no debe superar 40 caracteres', true);
      return;
    }
    if (notas.length > 100) {
      toast('La nota no debe superar 100 caracteres', true);
      return;
    }

    const datos = new URLSearchParams();
    datos.append('idUsuario', String(idUsuario));
    datos.append('glucosa', String(glucosa));
    datos.append('contexto', contexto);
    if (notas) datos.append('notas', notas);

    try {
      await fetchJson(base + '/registrarMedida', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: datos
      }, 90000);

      toast('Lectura guardada');
      $('valor').value = '';
      $('nota').value = '';

      $('selFiltro').value = String(idUsuario);
      filtro = String(idUsuario);
      await cargarMedidas();
      setStatus('online', 'API conectada');
    } catch (err) {
      toast(err.message || 'No se pudo guardar la lectura', true);
    }
  }

  const clase = (v) => (v > 140 ? 'alta' : v < 70 ? 'baja' : '');

  function fechaLocal(f) {
    if (!f) return 'Sin fecha';
    const d = new Date(String(f).replace(' ', 'T'));
    return isNaN(d.getTime())
      ? String(f)
      : d.toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' });
  }

  function render() {
    const orden = [...medidas].sort((a, b) => {
      const fa = String(a.fechaHora || '');
      const fb = String(b.fechaHora || '');
      return fb.localeCompare(fa) || (Number(b.idMedida) || 0) - (Number(a.idMedida) || 0);
    });

    const n = orden.length;
    const valores = orden.map((m) => Number(m.glucosa)).filter((v) => !isNaN(v));

    $('sCount').textContent = n;
    $('sLast').innerHTML = n ? valores[0] + '<small>mg/dL</small>' : '-<small>mg/dL</small>';
    $('sAvg').innerHTML = valores.length
      ? Math.round(valores.reduce((s, v) => s + v, 0) / valores.length) + '<small>mg/dL</small>'
      : '-<small>mg/dL</small>';
    $('sRange').innerHTML = valores.length
      ? Math.round((valores.filter((v) => v >= 70 && v <= 140).length / valores.length) * 100) + '<small>%</small>'
      : '-<small>%</small>';

    const ul = $('lista');
    ul.innerHTML = '';

    if (!n) {
      const vacio = document.createElement('div');
      vacio.className = 'empty';
      vacio.textContent = filtro
        ? 'Este usuario no tiene lecturas todavía.'
        : 'Aún no hay lecturas. Crea un usuario y guarda la primera.';
      ul.appendChild(vacio);
    }

    orden.forEach((m) => {
      const valor = Number(m.glucosa);
      const li = document.createElement('li');
      li.className = clase(valor);

      const val = document.createElement('div');
      val.className = 'val';
      val.innerHTML = valor + '<small>mg/dL</small>';

      const meta = document.createElement('div');
      meta.className = 'meta';

      const contexto = document.createElement('b');
      contexto.textContent = m.contexto || 'Sin contexto';
      meta.append(contexto, document.createElement('br'));

      const usuario = usuariosPorId[m.idUsuario];
      const detalle = fechaLocal(m.fechaHora)
        + (usuario ? ' · ' + nombreUsuario(usuario) : '')
        + (m.notas ? ' · ' + m.notas : '');
      meta.append(document.createTextNode(detalle));

      li.append(val, meta);
      ul.appendChild(li);
    });

    dibujar(orden.slice(0, 20).reverse());
  }

  /* Gráfica SVG simple: línea azul, puntos rojos si están fuera de rango alto */
  function dibujar(datos) {
    const cont = $('chart');
    if (datos.length < 2) {
      cont.innerHTML = '<div class="empty">Se necesitan al menos 2 lecturas para ver la tendencia.</div>';
      return;
    }

    const W = 600, H = 190, p = 28;
    const valores = datos.map((d) => Number(d.glucosa));
    const max = Math.max(200, ...valores) + 10;
    const min = Math.min(60, ...valores) - 10;
    const x = (i) => p + (i * (W - p * 2)) / (datos.length - 1);
    const y = (v) => H - p - ((v - min) / (max - min)) * (H - p * 2);

    const linea = datos
      .map((d, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(Number(d.glucosa)).toFixed(1))
      .join(' ');

    const puntos = datos.map((d, i) => {
      const v = Number(d.glucosa);
      const c = v > 140 ? '#ef4444' : '#3b82f6';
      return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1)
        + '" r="4.5" fill="' + c + '" stroke="rgba(255,255,255,.7)" stroke-width="1.2">'
        + '<title>' + v + ' mg/dL</title></circle>';
    }).join('');

    cont.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Tendencia de glucosa">'
      + '<rect x="' + p + '" y="' + y(140).toFixed(1) + '" width="' + (W - p * 2)
      + '" height="' + (y(70) - y(140)).toFixed(1) + '" fill="rgba(59,130,246,.12)"/>'
      + '<path d="' + linea + '" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
      + puntos + '</svg>';
  }

  $('formUsuario').addEventListener('submit', crearUsuario);
  $('formMedida').addEventListener('submit', registrarMedida);

  $('saveApi').addEventListener('click', () => {
    const nueva = normalizarBase($('apiUrl').value);
    if (!nueva) {
      toast('Escribe la URL de la API', true);
      return;
    }
    $('apiUrl').value = nueva;
    try { localStorage.setItem(LS_API, nueva); } catch (e) {}
    cargarTodo();
  });

  $('selFiltro').addEventListener('change', () => {
    cargarMedidas().catch((e) => toast(e.message || 'No se pudo filtrar', true));
  });

  $('btnRefrescar').addEventListener('click', () => cargarTodo());

  try {
    const guardada = localStorage.getItem(LS_API);
    base = normalizarBase(guardada) || API_DEFECTO;
    filtro = localStorage.getItem(LS_FILTRO) || '';
  } catch (e) {
    base = API_DEFECTO;
  }

  $('apiUrl').value = base;
  cargarTodo();
})();
</script>
</body>
</html>
